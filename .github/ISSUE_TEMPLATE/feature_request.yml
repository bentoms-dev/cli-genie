name: Feature request
description: Suggest an idea for CLI Genie
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
